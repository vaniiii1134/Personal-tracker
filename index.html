<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Complete Life Organizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .app-title { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-size: 14px; opacity: 0.9; }
        
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .tab { 
            background: rgba(255,255,255,0.15); 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .tab:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .tab.active { background: rgba(255,255,255,0.3); }
        .tab-icon { font-size: 28px; display: block; margin-bottom: 8px; }
        .tab-text { font-size: 14px; font-weight: 600; }
        
        .content { display: none; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; backdrop-filter: blur(20px); }
        .content.active { display: block; }
        
        .section-title { font-size: 20px; margin-bottom: 20px; text-align: center; }
        
        /* Habits */
        .habit-list { max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        .habit-item { 
            background: rgba(255,255,255,0.2); 
            margin-bottom: 12px; 
            padding: 15px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .habit-name { font-weight: 600; }
        .habit-stats { font-size: 12px; opacity: 0.8; }
        .habit-complete { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .habit-miss { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .habit-empty { background: transparent; border: 2px solid rgba(255,255,255,0.5); color: rgba(255,255,255,0.7); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        
        /* Money */
        .money-input { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        input { width: 100%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.2); color: white; font-size: 16px; }
        input::placeholder { color: rgba(255,255,255,0.7); }
        .btn { 
            background: linear-gradient(45deg, #10b981, #059669); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-secondary { background: linear-gradient(45deg, #3b82f6, #2563eb); }
        .summary { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-top: 15px; }
        
        /* Moods */
        .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .mood-btn { 
            aspect-ratio: 1; 
            border-radius: 12px; 
            border: none; 
            font-size: 24px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .mood-1 { background: #ef4444; }
        .mood-2 { background: #f97316; }
        .mood-3 { background: #eab308; }
        .mood-4 { background: #84cc16; }
        .mood-5 { background: #10b981; }
        .mood-6 { background: #06b6d4; }
        .mood-7 { background: #0ea5e9; }
        .mood-8 { background: #3b82f6; }
        .mood-9 { background: #8b5cf6; }
        .mood-10 { background: #ec4899; }
        .mood-btn.today { transform: scale(1.1); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        
        /* Charts */
        .chart { height: 200px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-top: 15px; position: relative; }
        .chart-bar { position: absolute; bottom: 0; background: linear-gradient(45deg, #10b981, #059669); border-radius: 6px 6px 0 0; }
        
        .add-habit { display: flex; gap: 10px; margin-bottom: 15px; }
        .habit-input { flex: 1; }
        
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-card { background: rgba(255,255,255,0.15); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 800; }
        .stat-label { font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="app-title">Your Complete Life</div>
            <div class="subtitle">4 Organizer Tools in 1 App</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('habits')">
                <span class="tab-icon">✅</span>
                <div class="tab-text">Habits</div>
            </div>
            <div class="tab" onclick="switchTab('moods')">
                <span class="tab-icon">😊</span>
                <div class="tab-text">Moods</div>
            </div>
            <div class="tab" onclick="switchTab('money')">
                <span class="tab-icon">💰</span>
                <div class="tab-text">Money</div>
            </div>
            <div class="tab" onclick="switchTab('journal')">
                <span class="tab-icon">📝</span>
                <div class="tab-text">Journal</div>
            </div>
        </div>
        
        <!-- HABITS -->
        <div id="habits" class="content active">
            <div class="section-title">📊 Daily Habits</div>
            <div class="add-habit">
                <input type="text" id="habitInput" placeholder="New habit..." class="habit-input">
                <button class="btn" onclick="addHabit()">Add</button>
            </div>
            <div class="habit-list" id="habitList"></div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="streakCount">0</div>
                    <div class="stat-label">Current Streak</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completionRate">0%</div>
                    <div class="stat-label">Completion</div>
                </div>
            </div>
        </div>
        
        <!-- MOODS -->
        <div id="moods" class="content">
            <div class="section-title">😊 Today's Mood</div>
            <div class="mood-grid" id="moodGrid"></div>
            <div class="chart" id="moodChart">
                <div class="chart-bar" style="left:10%; width:8%; height:80%"></div>
                <div class="chart-bar" style="left:25%; width:8%; height:60%"></div>
                <div class="chart-bar" style="left:40%; width:8%; height:90%"></div>
                <div class="chart-bar" style="left:55%; width:8%; height:40%"></div>
                <div class="chart-bar" style="left:70%; width:8%; height:70%"></div>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="avgMood">5.0</div>
                    <div class="stat-label">Avg Mood</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="moodStreak">3</div>
                    <div class="stat-label">Mood Streak</div>
                </div>
            </div>
        </div>
        
        <!-- MONEY -->
        <div id="money" class="content">
            <div class="section-title">💰 Finance Tracker</div>
            <div class="money-input">
                <input type="number" id="amountInput" placeholder="₹ 100">
                <input type="text" id="categoryInput" placeholder="Food/Transport/etc">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="addExpense()">➕ Expense</button>
                <button class="btn btn-secondary" onclick="addIncome()">💵 Income</button>
            </div>
            <div class="summary">
                <div>Monthly Expenses: <span id="totalExpenses">₹0</span></div>
                <div>Monthly Income: <span id="totalIncome">₹0</span></div>
                <div>Savings: <span id="savings">₹0</span></div>
            </div>
        </div>
        
        <!-- JOURNAL -->
        <div id="journal" class="content">
            <div class="section-title">📝 Daily Journal</div>
            <textarea id="journalText" rows="8" placeholder="What's on your mind today? 💭" style="width:100%; padding:15px; border-radius:12px; border:none; background:rgba(255,255,255,0.15); color:white; font-size:16px; resize:vertical;"></textarea>
            <button class="btn" onclick="saveJournal()" style="margin-top:15px;">💾 Save Entry</button>
            <div id="journalEntries"></div>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('completeLifeData')) || {
            habits: {},
            moods: {},
            expenses: [],
            income: [],
            journal: []
        };
        let today = new Date().toISOString().split('T')[0];
        
        function saveData() {
            localStorage.setItem('completeLifeData', JSON.stringify(data));
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'habits') refreshHabits();
            if (tabName === 'moods') refreshMoods();
            if (tabName === 'money') refreshFinance();
            if (tabName === 'journal') refreshJournal();
        }
        
        function addHabit() {
            let name = document.getElementById('habitInput').value.trim();
            if (!name) return;
            
            if (!data.habits[name]) data.habits[name] = {};
            data.habits[name][today] = data.habits[name][today] || 0;
            saveData();
            document.getElementById('habitInput').value = '';
            refreshHabits();
        }
        
        function toggleHabit(name) {
            data.habits[name][today] = (data.habits[name][today] || 0) + 1;
            if (data.habits[name][today] > 2) data.habits[name][today] = 0;
            saveData();
            refreshHabits();
        }
        
        function refreshHabits() {
            let list = document.getElementById('habitList');
            list.innerHTML = '';
            
            let total = 0, completed = 0;
            Object.keys(data.habits).forEach(name => {
                let todayStatus = data.habits[name][today] || 0;
                let item = document.createElement('div');
                item.className = 'habit-item';
                item.innerHTML = `
                    <div>
                        <div class="habit-name">${name}</div>
                        <div class="habit-stats">Streak: ${getStreak(name)} days</div>
                    </div>
                    <button class="habit-${todayStatus === 1 ? 'complete' : todayStatus === 2 ? 'miss' : 'empty'}" 
                            onclick="toggleHabit('${name}')">
                        ${todayStatus === 1 ? '✅' : todayStatus === 2 ? '❌' : '○'}
                    </button>
                `;
                list.appendChild(item);
                
                total++;
                if (todayStatus === 1) completed++;
            });
            
            document.getElementById('completionRate').textContent = total ? `${Math.round(completed/total*100)}%` : '0%';
            document.getElementById('streakCount').textContent = getLongestStreak();
        }
        
        function getStreak(name) {
            let streak = 0;
            let date = new Date(today);
            for (let i = 0; i < 30; i++) {
                let checkDate = date.toISOString().split('T')[0];
                if (data.habits[name][checkDate] === 1) streak++;
                else break;
                date.setDate(date.getDate() - 1);
            }
            return streak;
        }
        
        function getLongestStreak() {
            let maxStreak = 0;
            Object.keys(data.habits).forEach(name => {
                maxStreak = Math.max(maxStreak, getStreak(name));
            });
            return maxStreak;
        }
        
        function refreshMoods() {
            let grid = document.getElementById('moodGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                let btn = document.createElement('button');
                btn.className = `mood-btn mood-${i}`;
                btn.textContent = i;
                btn.onclick = () => logMood(i);
                if (data.moods[today] === i) btn.classList.add('today');
                grid.appendChild(btn);
            }
        }
        
        function logMood(score) {
            data.moods[today] = score;
            saveData();
            refreshMoods();
        }
        
        function addExpense() {
            let amount = parseFloat(document.getElementById('amountInput').value);
            let category = document.getElementById('categoryInput').value;
            if (amount && category) {
                data.expenses.push({date: today, amount, category, type: 'expense'});
                document.getElementById('amountInput').value = '';
                document.getElementById('categoryInput').value = '';
                saveData();
                refreshFinance();
            }
        }
        
        function addIncome() {
            let amount = parseFloat(document.getElementById('amountInput').value);
            let source = document.getElementById('categoryInput').value;
            if (amount && source) {
                data.income.push({date: today, amount, source, type: 'income'});
                document.getElementById('amountInput').value = '';
                document.getElementById('categoryInput').value = '';
                saveData();
                refreshFinance();
            }
        }
        
        function refreshFinance() {
            let month = today.slice(0,7);
            let expenses = data.expenses.filter(e => e.date.startsWith(month));
            let income = data.income.filter(i => i.date.startsWith(month));
            
            document.getElementById('totalExpenses').textContent = `₹${expenses.reduce((sum,e)=>sum+e.amount,0).toLocaleString()}`;
            document.getElementById('totalIncome').textContent = `₹${income.reduce((sum,i)=>sum+i.amount,0).toLocaleString()}`;
            document.getElementById('savings').textContent = `₹${(income.reduce((sum,i)=>sum+i.amount,0) - expenses.reduce((sum,e)=>sum+e.amount,0)).toLocaleString()}`;
        }
        
        function saveJournal() {
            let text = document.getElementById('journalText').value.trim();
            if (text) {
                data.journal.unshift({date: today, text});
                if (data.journal.length > 30) data.journal.pop();
                document.getElementById('journalText').value = '';
                saveData();
                refreshJournal();
            }
        }
        
        function refreshJournal() {
            let entries = document.getElementById('journalEntries');
            entries.innerHTML = data.journal.slice(0,5).map(e => 
                `<div style="background:rgba(255,255,255,0.15);padding:15px;margin-bottom:10px;border-radius:12px;">
                    <div style="font-size:12px;opacity:0.8;">${e.date}</div>
                    ${e.text}
                </div>`
            ).join('');
        }
        
        // Initialize
        refreshHabits();
        refreshMoods();
        refreshFinance();
        refreshJournal();
        
        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>
</body>
                </html>
